<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login – Der Architekt deines Lebens</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>
<style>
  :root { --orange: #d9682c; --navy: #00224d; --white: #fffaf1; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--navy);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .login-card {
    background: var(--white);
    border-radius: 4px;
    padding: 48px 44px;
    width: 100%; max-width: 420px;
    box-shadow: 0 32px 80px rgba(0,0,0,0.35);
    position: relative; overflow: hidden;
  }
  .login-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0;
    height: 4px; background: var(--orange);
  }
  .login-logo {
    font-family: "Fraunces", serif;
    font-size: 1.3rem; font-weight: 600; letter-spacing: .01em;
    color: var(--navy); margin-bottom: 6px;
    display: flex; align-items: center; gap: 10px;
  }
  .login-logo svg { width: 26px; height: 26px; flex: none; color: var(--orange); }
  .login-badge {
    font-family: 'Orbitron', monospace;
    font-size: 9px; font-weight: 700; letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--orange);
    background: rgba(217,104,44,0.1);
    border: 1px solid rgba(217,104,44,0.25);
    padding: 3px 8px; border-radius: 2px;
    display: inline-block; margin-bottom: 32px;
  }
  h1 {
    font-family: 'Archivo', system-ui, sans-serif;
    font-size: 26px; font-weight: 800;
    color: var(--navy); margin-bottom: 24px;
  }
  .form-group { margin-bottom: 18px; }
  label {
    font-family: 'Orbitron', monospace;
    font-size: 9px; font-weight: 700; letter-spacing: .16em;
    text-transform: uppercase; color: rgba(0,34,77,0.6);
    display: block; margin-bottom: 7px;
  }
  input {
    width: 100%; padding: 12px 14px;
    border: 1px solid rgba(0,34,77,0.18); border-radius: 2px;
    font-family: 'DM Sans', sans-serif; font-size: 15px;
    color: var(--navy); background: #eee4cf;
    outline: none; transition: border-color .2s, box-shadow .2s;
  }
  input:focus {
    border-color: var(--orange);
    box-shadow: 0 0 0 3px rgba(217,104,44,0.1);
    background: #fff;
  }
  .btn-login {
    width: 100%; padding: 14px;
    background: var(--orange); color: var(--white);
    border: none; border-radius: 2px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px; font-weight: 500;
    cursor: pointer; margin-top: 8px;
    transition: background .2s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-login:hover:not(:disabled) { background: #bd551f; }
  .btn-login:disabled { opacity: .65; cursor: not-allowed; }
  .spinner {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid rgba(255,250,241,0.3);
    border-top-color: #fff;
    animation: spin .7s linear infinite; display: none;
  }
  .btn-login.loading .spinner { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-msg {
    background: rgba(220,38,38,0.08);
    border: 1px solid rgba(220,38,38,0.25);
    color: #b91c1c; font-size: 13px;
    padding: 10px 14px; border-radius: 2px;
    margin-top: 14px; display: none;
  }
  .error-msg.visible { display: block; }
</style>
</head>
<body>

<div class="login-card">
  <div class="login-logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 20h18M5 20V9l7-5 7 5v11M9 20v-6h6v6"/></svg>
    Der Architekt deines Lebens
  </div>
  <span class="login-badge">Admin</span>
  <h1>Anmelden</h1>

  <form id="login-form" novalidate>
    <div class="form-group">
      <label for="email">E-Mail</label>
      <input type="email" id="email" placeholder="admin@beispiel.de" autocomplete="email">
    </div>
    <div class="form-group">
      <label for="password">Passwort</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button type="submit" class="btn-login" id="btn-login">
      <span class="spinner" id="spinner"></span>
      <span id="btn-label">Einloggen →</span>
    </button>
    <div class="error-msg" id="error-msg"></div>
  </form>
</div>

<script>
  // Bereits eingeloggt? → direkt weiterleiten
  db.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = 'admin-feedback.html';
  });

  document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('btn-login');
    const errEl    = document.getElementById('error-msg');

    if (!email || !password) {
      errEl.textContent = 'Bitte E-Mail und Passwort eingeben.';
      errEl.classList.add('visible'); return;
    }

    btn.disabled = true;
    btn.classList.add('loading');
    document.getElementById('btn-label').textContent = 'Wird geprüft …';
    errEl.classList.remove('visible');

    const { error } = await db.auth.signInWithPassword({ email, password });

    if (error) {
      errEl.textContent = 'Login fehlgeschlagen: ' + error.message;
      errEl.classList.add('visible');
      btn.disabled = false;
      btn.classList.remove('loading');
      document.getElementById('btn-label').textContent = 'Einloggen →';
    } else {
      window.location.href = 'admin-feedback.html';
    }
  });
</script>
</body>
</html>
