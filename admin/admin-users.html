<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admins – Der Architekt deines Lebens</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
  :root { --orange:#d9682c; --navy:#00224d; --white:#fffaf1; --green:#4c7a5e; --red:#dc2626; }
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'DM Sans',sans-serif; font-size:16px; background:#f6f0e3; color:var(--navy); padding-bottom:80px; }

  nav { position:fixed; top:0; left:0; right:0; z-index:100; display:flex; align-items:center; justify-content:center; padding:16px 5%; background:rgba(0,34,77,0.97); backdrop-filter:blur(8px); }
  .nav-inner { max-width:1200px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; width:100%; }
  .nav-logo { font-family:"Fraunces",serif; color:var(--white); font-size:1.05rem; font-weight:600; letter-spacing:.01em; text-decoration:none; display:flex; align-items:center; gap:10px; white-space:nowrap; }
  .nav-logo svg { width:26px; height:26px; flex:none; color:var(--orange); }
  .nav-admin-badge { font-family:'Orbitron',monospace; font-size:9px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; background:rgba(217,104,44,0.2); border:1px solid rgba(217,104,44,0.4); color:var(--orange); padding:3px 8px; border-radius:2px; }
  .nav-links { display:flex; gap:10px; align-items:center; }
  .nav-link { color:rgba(255,250,241,0.6); font-size:13px; text-decoration:none; border:1px solid rgba(255,250,241,0.15); padding:7px 14px; border-radius:2px; background:transparent; cursor:pointer; transition:background .2s,color .2s; font-family:'DM Sans',sans-serif; }
  .nav-link:hover { background:rgba(255,250,241,0.08); color:var(--white); }
  .nav-link.active { border-color:rgba(217,104,44,0.5); color:var(--orange); }

  .admin-header { background:var(--navy); padding:100px 0 60px; position:relative; overflow:hidden; }
  .admin-header::before { content:''; position:absolute; inset:0; background-image:repeating-linear-gradient(90deg,rgba(217,104,44,0.04) 0px,rgba(217,104,44,0.04) 1px,transparent 1px,transparent 80px); pointer-events:none; }
  .admin-header::after { content:''; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--orange); }
  .admin-header-inner { max-width:900px; margin:0 auto; padding:0 32px; position:relative; z-index:1; }
  .admin-page-label { font-family:'Orbitron',monospace; font-size:10px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--orange); margin-bottom:14px; display:block; }
  .admin-header h1 { font-family:'Archivo',system-ui,sans-serif; font-weight:800; font-size:clamp(28px,3.5vw,44px); color:var(--white); line-height:1.1; margin-bottom:12px; }
  .admin-header h1 em { font-style:normal; color:var(--orange); }
  .admin-header p { font-size:15px; color:rgba(255,250,241,0.55); max-width:560px; line-height:1.7; }

  .admin-main { max-width:900px; margin:0 auto; padding:40px 32px 0; }
  .list-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
  .list-title { font-family:'Fredoka',sans-serif; font-size:22px; }
  .btn-new { display:inline-flex; align-items:center; gap:6px; background:var(--orange); color:var(--white); border:none; border-radius:4px; padding:10px 20px; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:600; cursor:pointer; transition:background .2s; }
  .btn-new:hover { background:#bd551f; }
  .btn-new:disabled { opacity:.4; cursor:default; pointer-events:none; }

  .table-wrap { background:var(--white); border:1px solid rgba(0,34,77,0.1); border-radius:8px; overflow:hidden; }
  table { width:100%; border-collapse:collapse; }
  thead { background:rgba(0,34,77,0.04); }
  th { padding:12px 16px; text-align:left; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:rgba(0,34,77,0.5); }
  td { padding:13px 16px; border-top:1px solid rgba(0,34,77,0.06); font-size:14px; vertical-align:middle; }
  tr.view-row:hover td { background:rgba(217,104,44,0.03); }
  tr.edit-row td { background:rgba(217,104,44,0.04); padding-top:9px; padding-bottom:9px; }

  .td-email { font-weight:600; max-width:240px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .td-meta  { color:rgba(0,34,77,0.55); font-size:13px; white-space:nowrap; }
  .td-actions { white-space:nowrap; text-align:right; }
  .you-badge { display:inline-block; margin-left:8px; font-family:'Orbitron',monospace; font-size:9px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; background:rgba(0,34,77,0.08); color:rgba(0,34,77,0.5); padding:2px 7px; border-radius:2px; vertical-align:middle; }

  .inp-inline { width:100%; padding:7px 10px; border:1px solid rgba(0,34,77,0.2); border-radius:4px; font-family:'DM Sans',sans-serif; font-size:14px; color:var(--navy); background:var(--white); outline:none; transition:border-color .15s, box-shadow .15s; }
  .inp-inline:focus { border-color:var(--orange); box-shadow:0 0 0 3px rgba(217,104,44,0.12); }
  .inp-inline.error { border-color:var(--red); }

  .btn-row { border:none; border-radius:3px; padding:5px 11px; font-size:12px; cursor:pointer; font-family:'DM Sans',sans-serif; font-weight:500; transition:background .15s; }
  .btn-del-row    { background:rgba(220,38,38,0.1); color:var(--red); }
  .btn-del-row:hover  { background:rgba(220,38,38,0.2); }
  .btn-del-row:disabled { opacity:.4; cursor:default; pointer-events:none; }
  .btn-save-row   { background:var(--orange); color:var(--white); margin-right:5px; }
  .btn-save-row:hover { background:#bd551f; }
  .btn-cancel-row { background:rgba(0,34,77,0.08); color:var(--navy); }
  .btn-cancel-row:hover { background:rgba(0,34,77,0.15); }

  #empty-row td { padding:48px; text-align:center; color:rgba(0,34,77,0.4); font-size:14px; }

  #toast { position:fixed; bottom:32px; right:32px; z-index:999; padding:12px 20px; border-radius:4px; font-size:14px; font-weight:500; color:var(--white); display:none; }
  #toast.success { background:var(--green); }
  #toast.error   { background:var(--red); }

  @media(max-width:600px) {
    .admin-header-inner,.admin-main { padding-left:20px; padding-right:20px; }
    .td-meta { display:none; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="../startseite.html" class="nav-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 20h18M5 20V9l7-5 7 5v11M9 20v-6h6v6"/></svg>
      Der Architekt deines Lebens<span class="nav-admin-badge">Admin</span>
    </a>
    <div class="nav-links">
      <a href="admin-feedback.html" class="nav-link">Feedback</a>
      <a href="umfrage-auswertung.html" class="nav-link">Umfragen</a>
      <a href="landingpages.html" class="nav-link">Landingpages</a>
      <a href="tools.html" class="nav-link">Tools</a>
      <a href="admin-users.html" class="nav-link active">Admins</a>
      <button id="btn-logout" class="nav-link" style="border-color:rgba(220,38,38,0.4);color:#f87171;">Ausloggen</button>
    </div>
  </div>
</nav>

<div class="admin-header">
  <div class="admin-header-inner">
    <span class="admin-page-label">Verwaltung</span>
    <h1>Admin<em>-Zugänge</em></h1>
    <p>Admins hinzufügen oder entfernen. Jeder Admin hat vollen Zugriff auf Events, Teilnehmer und Zahlungslinks.</p>
  </div>
</div>

<div class="admin-main">
  <div class="list-header">
    <div class="list-title">Alle Admins</div>
    <button class="btn-new" id="btn-new">+ Neuer Admin</button>
  </div>
  <div class="table-wrap">
    <table id="users-table">
      <thead><tr><th style="width:32%">E-Mail</th><th>Erstellt</th><th>Letzter Login</th><th style="width:110px"></th></tr></thead>
      <tbody id="users-tbody">
        <tr id="empty-row"><td colspan="4">Wird geladen…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div id="toast"></div>

<script>
db.auth.getSession().then(({ data }) => {
  if (!data.session) window.location.href = 'admin-login.html';
});
document.getElementById('btn-logout').addEventListener('click', async () => {
  await db.auth.signOut();
  window.location.href = 'admin-login.html';
});

// ── Helpers ───────────────────────────────────────────────────
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = type; t.style.display = 'block';
  clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', 3000);
}
function fmtDate(iso) {
  if (!iso) return '–';
  const d = new Date(iso);
  return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' })
    + ' ' + d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
}

// ── State ─────────────────────────────────────────────────────
let users = [];
let currentUserId = null;

function setNewBtnEnabled(on) {
  document.getElementById('btn-new').disabled = !on;
}

// ── Empty-state row ───────────────────────────────────────────
function showEmptyState(msg) {
  let row = document.getElementById('empty-row');
  if (!row) {
    row = document.createElement('tr');
    row.id = 'empty-row';
    document.getElementById('users-tbody').appendChild(row);
  }
  row.innerHTML = '<td colspan="4">' + msg + '</td>';
  row.style.display = '';
}
function hideEmptyState() {
  const row = document.getElementById('empty-row');
  if (row) row.style.display = 'none';
}

// ── Build a view row ──────────────────────────────────────────
function createViewRow(u) {
  const tr = document.createElement('tr');
  tr.className = 'view-row';
  tr.dataset.id = u.id;
  const isSelf = u.id === currentUserId;
  tr.innerHTML = `
    <td class="td-email" title="${esc(u.email)}">${esc(u.email)}${isSelf ? '<span class="you-badge">Du</span>' : ''}</td>
    <td class="td-meta">${fmtDate(u.created_at)}</td>
    <td class="td-meta">${fmtDate(u.last_sign_in_at)}</td>
    <td class="td-actions">
      <button class="btn-row btn-del-row" ${isSelf ? 'disabled title="Du kannst dich nicht selbst löschen"' : ''}>Löschen</button>
    </td>`;
  const delBtn = tr.querySelector('.btn-del-row');
  if (!isSelf) delBtn.addEventListener('click', () => deleteUser(u, tr));
  return tr;
}

// ── Build the "new admin" edit row ────────────────────────────
function createEditRow(onSave, onCancel) {
  const tr = document.createElement('tr');
  tr.className = 'edit-row';
  tr.innerHTML = `
    <td><input class="inp-inline inp-email" type="email" placeholder="admin@beispiel.de" autocomplete="off"></td>
    <td colspan="2"><input class="inp-inline inp-password" type="password" placeholder="Startpasswort (min. 8 Zeichen)" autocomplete="new-password"></td>
    <td class="td-actions">
      <button class="btn-row btn-save-row">Speichern</button>
      <button class="btn-row btn-cancel-row">Abbrechen</button>
    </td>`;
  const emailInp = tr.querySelector('.inp-email');
  const passInp  = tr.querySelector('.inp-password');

  function validate() {
    let ok = true;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailInp.value.trim())) { emailInp.classList.add('error'); ok = false; } else emailInp.classList.remove('error');
    if (passInp.value.length < 8) { passInp.classList.add('error'); ok = false; } else passInp.classList.remove('error');
    return ok;
  }

  tr.querySelector('.btn-save-row').addEventListener('click', () => {
    if (validate()) onSave(emailInp.value.trim(), passInp.value);
  });
  tr.querySelector('.btn-cancel-row').addEventListener('click', onCancel);
  [emailInp, passInp].forEach(inp => inp.addEventListener('keydown', e => {
    if (e.key === 'Enter')  { e.preventDefault(); if (validate()) onSave(emailInp.value.trim(), passInp.value); }
    if (e.key === 'Escape') { e.preventDefault(); onCancel(); }
  }));

  setTimeout(() => emailInp.focus(), 0);
  return tr;
}

// ── Load & render ─────────────────────────────────────────────
async function loadUsers() {
  const tbody = document.getElementById('users-tbody');
  const { data: sessionData } = await db.auth.getSession();
  currentUserId = sessionData?.session?.user?.id || null;

  const { data, error } = await db.functions.invoke('admin-users', { body: { action: 'list' } });
  if (error || data?.error) { showToast('Fehler beim Laden: ' + (data?.error || error.message), 'error'); return; }
  users = data.users || [];

  Array.from(tbody.querySelectorAll('tr:not(#empty-row)')).forEach(r => r.remove());

  if (users.length === 0) {
    showEmptyState('Noch keine Admins vorhanden.');
  } else {
    hideEmptyState();
    users.forEach(u => tbody.appendChild(createViewRow(u)));
  }
  setNewBtnEnabled(true);
}

// ── Add new ───────────────────────────────────────────────────
document.getElementById('btn-new').addEventListener('click', () => {
  setNewBtnEnabled(false);
  hideEmptyState();

  const tbody = document.getElementById('users-tbody');
  const editRow = createEditRow(
    async (email, password) => {
      const { data, error } = await db.functions.invoke('admin-users', { body: { action: 'create', email, password } });
      if (error || data?.error) { showToast('Fehler: ' + (data?.error || error.message), 'error'); return; }
      showToast('Admin angelegt ✓', 'success');
      editRow.remove();
      await loadUsers();
    },
    () => {
      editRow.remove();
      if (users.length === 0) showEmptyState('Noch keine Admins vorhanden.');
      setNewBtnEnabled(true);
    }
  );
  tbody.insertBefore(editRow, tbody.firstChild);
});

// ── Delete ────────────────────────────────────────────────────
async function deleteUser(u, row) {
  if (!confirm('Admin "' + u.email + '" löschen? Diese Person kann sich danach nicht mehr einloggen.')) return;
  const { data, error } = await db.functions.invoke('admin-users', { body: { action: 'delete', userId: u.id } });
  if (error || data?.error) { showToast('Fehler: ' + (data?.error || error.message), 'error'); return; }
  showToast('Admin gelöscht.', 'success');
  row.remove();
  users = users.filter(x => x.id !== u.id);
  if (users.length === 0) showEmptyState('Noch keine Admins vorhanden.');
}

// ── Init ──────────────────────────────────────────────────────
loadUsers();
</script>
</body>
</html>
