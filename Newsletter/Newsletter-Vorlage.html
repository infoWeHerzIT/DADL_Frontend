<!DOCTYPE html>
<html lang="de" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="x-apple-disable-message-reformatting">
<title>{{BETREFF}}</title>
<!--[if mso]>
<noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript>
<![endif]-->
<!--
  NEWSLETTER-VORLAGE MAIL v3 – Der Architekt Deines Lebens · Stand 12.10.2026 · Max
  Neu in v3: Markenlogo im Kopf, Coaches-Foto im Inhalt und Instagram-Logo im Footer.
  Nachtrag 12.10. (Vorgabe Sorin): gesamter Inhalt + Fußzeile in EINEM Container,
    max. 700 px breit, horizontal zentriert. Outlook (Windows): MSO-Ghost-Table 700 px.
    Handy (bis 740 px Fensterbreite): Container 100 % Breite.
  Tabellen-Layout, Stile inline, keine Skripte.
  Quelle Farben/Schriften: _DADL\_Gemeinsam\Branding.md (Canva Brand Kit „DADL“).

  BILDER
    Markenlogo: assets\brand\der_architekt_deines_lebens Logo transparent.png
    Instagram:  assets\brand\der_architekt_deines_lebens (1080 X 120 Px).png
    Foto:       Coaches\LiliUndSorin\Sorin_Lili 02_small.png
    Die Bildpfade sind relativ zu dieser Vorlage. Vor dem Newsletter-Versand durch
    öffentlich erreichbare Bild-URLs oder die vom Mail-System unterstützte Einbettung ersetzen.
  ABMELDUNG
    {{EMAIL}} im Link muss beim Versand durch die E-Mail-Adresse des Empfängers ersetzt werden.

  FARBEN (Rolle laut Branding.md)
    #FEFAF1  Off-White      Seitenhintergrund außen
    #FFFFFF  Weiß           Inhaltsfläche
    #09204A  Navy           Wortmarke, Überschrift, Fließtext, Fußzeile
    #CC6E3B  Orange         nur Linie und Kasten-Rand (nie für Text)
    #AF5B2D  Orange dunkel  Links (nur auf Weiß/Off-White, nicht im Kasten)
    #F6F0E4  Creme hell     Hintergrund Einladungs-Kasten
  SCHRIFTEN (keine Webfonts geladen – Mailprogramme nutzen sonst die Ausweichschrift)
    Überschrift/Wortmarke: 'Archivo', Arial, Helvetica, sans-serif
    Text:                  'Source Sans 3', Arimo, Arial, Helvetica, sans-serif
  Kein „Binate“. Keine großflächigen Navy-Hintergründe.
-->
<style>
  /* Nur für Handy-Darstellung; alle Grundstile sind inline. */
  @media only screen and (max-width: 740px) {
    .container { width: 100% !important; max-width: 100% !important; }
    .pad { padding-left: 22px !important; padding-right: 22px !important; }
    .h1 { font-size: 25px !important; line-height: 33px !important; }
  }
  a { color: #AF5B2D; }
</style>
</head>
<body style="margin:0; padding:0; background-color:#FEFAF1;">

  <!-- Vorschautext (Preheader): unsichtbar, erscheint in der Postfach-Vorschau -->
  <div style="display:none; font-size:1px; line-height:1px; max-height:0; max-width:0; opacity:0; overflow:hidden; mso-hide:all;">
    {{VORSCHAUTEXT}}&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#FEFAF1;">
    <tr>
      <td align="center" style="padding:32px 12px;">

        <!--[if mso]>
        <table role="presentation" width="700" align="center" cellpadding="0" cellspacing="0" border="0" style="width:700px;"><tr><td>
        <![endif]-->

        <!-- CONTAINER: max. 700 px, zentriert – enthält Inhalt UND Fußzeile -->
        <table role="presentation" class="container" width="700" align="center" cellpadding="0" cellspacing="0" border="0" style="width:100%; max-width:700px; margin:0 auto;">
          <tr>
            <td style="padding:0;">

              <!-- INHALT (weiße Fläche) -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%; background-color:#FFFFFF;">

                <!-- Kopfbereich: Markenlogo links, Foto rechts -->
                <tr>
                  <td class="pad" style="padding:32px 44px 0 44px;">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td width="50%" align="left" valign="middle">
                          <img src="../assets/brand/der_architekt_deines_lebens%20Logo%20transparent.png" width="120" alt="Der Architekt Deines Lebens – Kompass-Logo" style="display:block; border:0; outline:none; text-decoration:none; width:120px; max-width:100%; height:auto;">
                        </td>
                        <td width="50%" align="right" valign="middle">
                          <img src="../Coaches/LiliUndSorin/Sorin_Lili 02_small_transparent.png" width="150" alt="Lili und Sorin" style="display:block; border:0; outline:none; text-decoration:none; width:100%; max-width:150px; height:auto;">
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>

                <!-- Linie (Orange) -->
                <tr>
                  <td class="pad" style="padding:24px 44px 0 44px;">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                      <tr><td style="border-top:2px solid #CC6E3B; font-size:0; line-height:0;">&nbsp;</td></tr>
                    </table>
                  </td>
                </tr>

                <!-- Überschrift -->
                <tr>
                  <td class="pad h1" style="padding:32px 44px 0 44px; font-family:'Archivo', Arial, Helvetica, sans-serif; font-size:28px; line-height:37px; font-weight:600; color:#09204A;">
                    {{UEBERSCHRIFT}}
                  </td>
                </tr>

                <!-- Text: jeder Absatz als eigenes <p style="..."> (Stil vom Muster übernehmen) -->
                <tr>
                  <td class="pad" style="padding:24px 44px 0 44px; font-family:'Source Sans 3', Arimo, Arial, Helvetica, sans-serif; font-size:17px; line-height:28px; color:#09204A;">
                    <p style="margin:0 0 20px 0;">{{TEXT}}</p>
                  </td>
                </tr>

                <!-- Einladung (hervorgehobener Kasten) – keine Links hier (Kontrast Orange dunkel auf Creme zu gering) -->
                <tr>
                  <td class="pad" style="padding:12px 44px 0 44px;">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td style="background-color:#F6F0E4; border-left:4px solid #CC6E3B; padding:22px 24px; font-family:'Source Sans 3', Arimo, Arial, Helvetica, sans-serif; font-size:17px; line-height:28px; color:#09204A;">
                          {{EINLADUNG}}
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>

                <!-- Gruß -->
                <tr>
                  <td class="pad" style="padding:32px 44px 44px 44px; font-family:'Source Sans 3', Arimo, Arial, Helvetica, sans-serif; font-size:17px; line-height:28px; color:#09204A;">
                    {{GRUSS}}
                  </td>
                </tr>

              </table>

              <!-- FUSSZEILE – gleiche Breite, zentriert (Rechtstexte: von Fachperson prüfen) -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;">
                <tr>
                  <td align="center" class="pad" style="padding:24px 44px 0 44px; font-family:'Source Sans 3', Arimo, Arial, Helvetica, sans-serif; font-size:13px; line-height:20px; color:#09204A; text-align:center;">
                    Der Architekt Deines Lebens · Lili &amp; Sorin<br>
                    <a href="https://www.instagram.com/der_architekt_deines_lebens/" style="text-decoration:none;"><img src="../assets/brand/der_architekt_deines_lebens%20(1080%20X%20120%20Px).png" width="264" height="29" alt="@der_architekt_deines_lebens auf Instagram" style="display:inline-block; border:0; outline:none; text-decoration:none; width:264px; max-width:100%; height:auto;"></a><br>
                    <a href="https://der-architekt-deines-lebens.de/rechtliches.html#impressum">Impressum</a> · <a href="https://der-architekt-deines-lebens.de/rechtliches.html#datenschutz">Datenschutz</a><br>
                    Du möchtest keine Post mehr? <a href="https://der-architekt-deines-lebens.de/Newsletter/Newsletter-Abmeldung.html?email={{EMAIL}}" style="color:#AF5B2D; text-decoration:underline;">Hier abmelden</a>
                  </td>
                </tr>
              </table>

            </td>
          </tr>
        </table>

        <!--[if mso]>
        </td></tr></table>
        <![endif]-->

      </td>
    </tr>
  </table>
</body>
</html>
